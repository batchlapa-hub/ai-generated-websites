<body class="mode-light">
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="index.html" class="site-logo" aria-label="Coisas da Carla"><svg viewBox='0 0 160 40' xmlns='http://www.w3.org/2000/svg'><text x='0' y='30' font-family='sans-serif' font-size='24' fill='#8e24aa'>Coisas da Carla</text></svg></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
      <a href="index.html">Início</a>
      <a href="services.html">Serviços</a>
      <a href="gallery.html">Galeria</a>
      <a href="contact.html">Contato</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section-gallery">
  <div class="gallery-grid">
    <figure>
      <img src="https://example.com/gallery1.jpg" alt="Sala de jantar com decoração rústica e iluminação ambiente">
      <figcaption>Sala de jantar com decoração rústica e iluminação ambiente</figcaption>
    </figure>
    <figure>
      <img src="https://example.com/gallery2.jpg" alt="Massagem terapêutica em ambiente privativo">
      <figcaption>Massagem terapêutica em ambiente privativo</figcaption>
    </figure>
    <figure>
      <img src="https://example.com/gallery3.jpg" alt="Cliente satisfeito com o corte de cabelo personalizado">
      <figcaption>Cliente satisfeito com o corte de cabelo personalizado</figcaption>
    </figure>
    <figure>
      <img src="https://example.com/gallery4.jpg" alt="Detalhes do serviço de sexo do bom em ambiente exclusivo">
      <figcaption>Detalhes do serviço de sexo do bom em ambiente exclusivo</figcaption>
    </figure>
  </div>
</section>

<section class="section-contact_form">
  <p>Tem alguma dúvida sobre nossa galeria ou quer agendar uma visita? Preencha o formulário abaixo:</p>
  <form role="form" aria-label="Formulário de contato para perguntas sobre a galeria e agendamento">
    <div class="form-group">
      <label for="name">Nome</label>
      <input type="text" id="name" name="name" placeholder="Seu nome completo" required>
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="exemplo@dominio.com" required>
    </div>
    <div class="form-group">
      <label for="phone">Telefone</label>
      <input type="tel" id="phone" name="phone" placeholder="(xx) xxxx-xxxx" required>
    </div>
    <div class="form-group">
      <label for="message">Mensagem</label>
      <textarea id="message" name="message" rows="5" placeholder="Como podemos ajudar?" required></textarea>
    </div>
    <button type="submit">Enviar</button>
  </form>
</section>
  </main>
