      <a href="index.html" class="site-logo" aria-label="PrimeFlow Plumbing"><svg viewBox='0 0 160 40' xmlns='http://www.w3.org/2000/svg'><text x='0' y='25' font-family='sans-serif' font-size='24' fill='currentColor'>PrimeFlow Plumbing</text></svg></a>

  <main>
    <section class="section-contact_form">
  <div class="container">
    <h2>Get in Touch With PrimeFlow Plumbing</h2>
    <p class="form-intro">Fill out the form below and we’ll get back to you as soon as possible.</p>
    <form novalidate>
      <div class="form-field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
        <span class="field-error" data-error-for="name"></span>
      </div>
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
        <span class="field-error" data-error-for="email"></span>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <span class="field-error" data-error-for="message"></span>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  </div>
</section>
