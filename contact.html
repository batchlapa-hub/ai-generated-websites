  <main>
    <section class="section-contact_form">
  <div class="container">
    <h2>Send Us a Message</h2>
    <p class="form-intro">Fill out the form below to get in touch with our team regarding inquiries or partnership requests.</p>
    <form novalidate>
      <div class="form-field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
        <span class="field-error" data-error-for="name"></span>
      </div>
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
        <span class="field-error" data-error-for="email"></span>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <span class="field-error" data-error-for="message"></span>
      </div>
      <button type="submit" class="btn btn-primary">Send Request</button>
    </form>
  </div>
</section>
  </main>
