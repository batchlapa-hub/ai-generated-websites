<head>

  <link rel="stylesheet" href="style.css">
</head>
<body class="mode-light">
  <header class="site-header">
    <div class="container site-header-inner">
      <a href="index.html" class="site-logo" aria-label="Modern Beauty Minimalist"><svg viewBox='0 0 160 40' fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10 5h10v30H10V5zm70 0h10v30H80V5z" stroke="currentColor" strokeWidth="4" strokeLinecap="round"/><path d="M120 10l-6 10 6 10v-20zM90 10l-6 10 6 10V10zm30 0h10v30H120V10z" fill="currentColor"/><path d="M5 20c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8zm76 0c0-4.418 3.582-8 8-8s8 3.582 8 8-3.582 8-8 8-8-3.582-8-8z" fill="currentColor"/></svg></a>
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav">
      <a href="index.html">Home</a>
      <a href="shop-all.html">Shop All</a>
      <a href="about.html">Our Story</a>
      <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section-contact_form">
  <div class="container">
    <h2></h2>
    <p class="form-intro"></p>
    <form novalidate>
      <div class="form-field">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required>
        <span class="field-error" data-error-for="name"></span>
      </div>
      <div class="form-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required>
        <span class="field-error" data-error-for="email"></span>
      </div>
      <div class="form-field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
        <span class="field-error" data-error-for="message"></span>
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>
  </div>
</section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer-inner">
      <p>&copy; 2026 Modern Beauty Minimalist. All rights reserved.</p>

    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
