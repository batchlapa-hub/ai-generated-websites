<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern SaaS Platform</title>
</head>
<body>
  <header>
    <section id="hero">
      <h1>Headline</h1>
      <p>Subheadline</p>
      <button>CTA Button</button>
    </section>
  </header>
  <main>
    <section id="features">
      <div class="feature-card">
        <span>Icon</span>
        <h2>Feature Title</h2>
        <p>Feature Description</p>
      </div>
      <div class="feature-card">
        <span>Icon</span>
        <h2>Feature Title</h2>
        <p>Feature Description</p>
      </div>
    </section>
    <section id="testimonials">
      <blockquote>"Quote"</blockquote>
      <img src="#" alt="Client Logo" />
      <span>★★★★★</span>
    </section>
    <section id="pricing">
      <div class="pricing-card">
        <h3>Tier Name</h3>
        <p>$0<span>/mo</span></p>
        <ul>
          <li>Feature 1</li>
          <li>Feature 2</li>
        </ul>
        <button>Annual/Biennial Switcher</button>
      </div>
      <div class="pricing-card">
        <h3>Tier Name</h3>

        <ul>
          <li>Feature 1</li>
          <li>Feature 2</li>
        </ul>
        <button>Annual/Biennial Switcher</button>
      </div>
    </section>
    <section id="contact">
      <form>
        <label for="email">Email Input</label>
        <input type="email" id="email" />
        <label for="message">Message</label>
        <textarea id="message"></textarea>
        <button type="submit">Submit Button</button>
      </form>
    </section>
  </main>
</body>
</html>
